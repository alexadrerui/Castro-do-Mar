<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Caminho perdido — Castro do Mar</title>
	<!-- GitHub Pages serves this for any missing address under the site (the idea of Ascent's themed 404) -->
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 22 16 6l13 16z' fill='%236b6b3a'/%3E%3Crect x='3' y='22' width='26' height='6' fill='%234a3526'/%3E%3C/svg%3E" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
	<style>
		:root { --gold: #c9a45c; --text: #e8e2d0; --muted: #a9b2a3; }
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; }
		body { display: grid; place-items: center; padding: 16px; color: var(--text); font: 15px/1.6 Inter, system-ui, sans-serif;
			background: linear-gradient(rgba(10, 14, 12, .55), rgba(10, 14, 12, .85)), url(/Castro-do-Mar/poster.jpg) center / cover no-repeat, #0a0e0c; }
		main { max-width: 520px; text-align: center; }
		.kicker { font: 500 12px Cinzel, serif; letter-spacing: .3em; color: var(--gold); text-transform: uppercase; margin: 0 0 8px; }
		h1 { font: 700 clamp(28px, 7vw, 44px)/1.15 Cinzel, serif; margin: 0 0 14px; }
		p { color: var(--muted); margin: 0 0 24px; }
		a { display: inline-block; padding: 10px 22px; border: 1px solid var(--gold); border-radius: 4px; color: var(--text); text-decoration: none; font: 500 14px Cinzel, serif; letter-spacing: .08em; background: rgba(201, 164, 92, .15); }
		a:hover, a:focus-visible { background: rgba(201, 164, 92, .3); }
	</style>
</head>
<body>
	<main>
		<p class="kicker">Anno Domini DCCCXC</p>
		<h1>Este caminho não leva ao castro</h1>
		<p>A trilha some entre as urzes. Volte à estrada principal e siga até o pórtico da vila.</p>
		<a href="/Castro-do-Mar/">Voltar ao Castro do Mar</a>
	</main>
</body>
</html>
